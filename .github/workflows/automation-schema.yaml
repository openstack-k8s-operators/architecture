---
name: Validate automation schema
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - stable
    paths:
      - ".ci/*"
      - "automation/vars/*.yaml"
      - "automation/vars/*.yml"

jobs:
  yamale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.10'

      - name: Install yaml-lint
        run: pip install yamale

      - name: Run yamale
        run: yamale -s .ci/automation-schema.yaml automation/vars/

  validate_automation:
    runs-on: ubuntu-latest
    needs:  # Ensure schema is valid before reading it
      - yamale
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.10'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run file checker
        run: python3 .ci/validate-schema-paths.py

      - name: Validate hook ordering
        run: python3 .ci/validate-hook-ordering.py
