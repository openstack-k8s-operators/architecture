---
name: Validate automation schema
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - stable
    paths:
      - ".ci/*"
      - "automation/vars/*.yaml"
      - "automation/vars/*.yml"

jobs:
  yamale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.10'

      - name: Install yaml-lint
        run: pip install yamale

      - name: Run yamale
        run: yamale -s .ci/automation-schema.yaml automation/vars/

  validate_automation:
    runs-on: ubuntu-latest
    needs:  # Ensure schema is valid before reading it
      - yamale
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.10'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run file checker
        run: python3 .ci/validate-schema-paths.py

      - name: Validate hook ordering
        run: python3 .ci/validate-hook-ordering.py
