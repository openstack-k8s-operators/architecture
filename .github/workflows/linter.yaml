---
name: file-consistency
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - stable
    paths:
      - "**.yaml"
      - "**.yml"
      - test-kustomizations.sh

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yaml-lint
        run: pip install yamllint

      - name: Run yaml-lint
        run: yamllint -c .yamllint.yml -s .

  test-kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Run test-kustomization script
        run: |
          kustomize version
          ./test-kustomizations.sh examples/

  test-zuul:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yaml
        run: pip install pyyaml

      - name: Run create-zuul-jobs
        run: |
          sha256sum zuul.d/* > checksum;
          ./create-zuul-jobs.py;
          sha256sum -c checksum || (git diff && exit 1) && exit 0;

  check-bmc-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check for hardcoded BMC credentials
        run: |
          if grep -r "password=password" --include="bmc-secret.env" .; then
            echo "ERROR: Found hardcoded 'password=password' in bmc-secret.env file(s)"
            exit 1
          fi
          if grep -r "username=admin" --include="bmc-secret.env" .; then
            echo "ERROR: Found hardcoded 'username=admin' in bmc-secret.env file(s)"
            exit 1
          fi
          echo "BMC credentials check passed"
