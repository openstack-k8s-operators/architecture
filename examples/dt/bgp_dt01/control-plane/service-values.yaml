---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-values
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  # --- Fields required by lib/control-plane ---
  preserveJobs: false
  notificationsBus:
    cluster: rabbitmq
  tls:
    caBundleSecretName: ""

  # --- Below are VA/DT-specific data ---
  glance:
    customServiceConfig: |
      [DEFAULT]
      enabled_backends = default_backend:swift
      [glance_store]
      default_backend = default_backend
      [default_backend]
      swift_store_create_container_on_put = True
      swift_store_auth_version = 3
      swift_store_auth_address = {{ .KeystoneInternalURL }}
      swift_store_endpoint_type = internalURL
      swift_store_user = service:glance
      swift_store_key = {{ .ServicePassword }}
    default:
      replicas: 1

  swift:
    enabled: true

  octavia:
    # With Native OVN BGP the controllers are the OVN gateway
    # chassis, so a flat in-cluster management network binds Octavia's router
    # ports to the controllers instead of the Networker nodes. The fix is to give
    # Octavia its own VLAN provider network routed through the Networkers
    # (lbMgmtNetwork below + "octavia:br-octavia" on the networker nodesets).
    #
    # Kept DISABLED on purpose: this VLAN provider-network approach is still
    # pending lab validation. Once validated, flip to "enabled: true" (the rest
    # of the plumbing below is already staged).
    enabled: false
    # Octavia management network settings, staged for when octavia is enabled.
    # Routes the provider network out over VLAN 23 to the Networker nodes
    # (physnet "octavia" -> br-octavia on the networkers) instead of the default
    # in-cluster flat network. Requires octavia-operator support for
    # providerNetworkType (openstack-k8s-operators/octavia-operator).
    lbMgmtNetwork:
      manageLbMgmtNetworks: true
      providerNetworkType: vlan
      providerPhysicalNetwork: octavia
      providerSegmentationID: 23
    amphoraImageContainerImage: quay.io/gthiemonge/octavia-amphora-image
    apacheContainerImage: registry.redhat.io/ubi9/httpd-24:latest
    octaviaAPI:
      networkAttachments:
        - internalapi
      customServiceConfig: |
        [controller_worker]
        loadbalancer_topology=ACTIVE_STANDBY
    octaviaHousekeeping:
      networkAttachments:
        - octavia
      customServiceConfig: |
        [controller_worker]
        loadbalancer_topology=ACTIVE_STANDBY
    octaviaHealthManager:
      networkAttachments:
        - octavia
      customServiceConfig: |
        [controller_worker]
        loadbalancer_topology=ACTIVE_STANDBY
    octaviaWorker:
      networkAttachments:
        - octavia
      customServiceConfig: |
        [controller_worker]
        loadbalancer_topology=ACTIVE_STANDBY
    nodeSelector:
      node-role.kubernetes.io/worker: ""

  # designate disabled and designate parameters commented out due to OSPRH-26878
  neutron:
    customServiceConfig: |
      [DEFAULT]
      service_plugins = qos,ovn-router,trunk,segments,port_forwarding,log,placement,ovn-bgp
      vlan_transparent = true
      debug = true
      dns_domain = example.org.
      # external_dns_driver = designate
      [ovs]
      igmp_snooping_enable = true
      [ml2_type_vlan]
      # Allow the "octavia" physnet as a VLAN provider network (datacentre kept).
      network_vlan_ranges = datacentre,octavia
      # [designate]
      # url = https://designate-internal.openstack.svc:9001/v2
      # auth_type = password
      # auth_url = {{ .KeystoneInternalURL }}
      # username = {{ .ServiceUser }}
      # password = {{ .ServicePassword }}
      # project_name = service
      # project_domain_name = Default
      # user_domain_name = Default
      # allow_reverse_dns_lookup = True
      # ipv4_ptr_zone_prefix_size = 24
      # ipv6_ptr_zone_prefix_size = 116
      # ptr_zone_email = admin@example.org

  designate-redis:
    enabled: false
    replicas: 1

  designate:
    enabled: false
    nsRecords:
      - hostname: ns1.example.org.
        priority: 1
      - hostname: ns2.example.org.
        priority: 2
    bind9Services:
      services:
        - metadata:
            annotations:
              metallb.universe.tf/address-pool: designateext
              metallb.universe.tf/allow-shared-ip: designateext
              metallb.universe.tf/LoadBalancerIPs: 172.34.0.80
          spec:
            type: LoadBalancer
        - metadata:
            annotations:
              metallb.universe.tf/address-pool: designateext
              metallb.universe.tf/allow-shared-ip: designateext
              metallb.universe.tf/LoadBalancerIPs: 172.34.0.81
          spec:
            type: LoadBalancer
        - metadata:
            annotations:
              metallb.universe.tf/address-pool: designateext
              metallb.universe.tf/allow-shared-ip: designateext
              metallb.universe.tf/LoadBalancerIPs: 172.34.0.82
          spec:
            type: LoadBalancer
