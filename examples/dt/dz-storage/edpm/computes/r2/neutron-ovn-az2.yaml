---
apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneService
metadata:
  name: neutron-ovn-az2
spec:
  addCertMounts: false
  caCerts: combined-ca-bundle
  containerImageFields:
    - EdpmNeutronOvnAgentImage
  dataSources:
    # neutron-ovn-agent-neutron-config is generated automatically by
    # neutron-operator (the NeutronAPI controller) when the control plane is
    # deployed. It holds the ovn-agent [ovn] NB/SB connection config.
    - secretRef:
        name: neutron-ovn-agent-neutron-config
    - secretRef:
        name: nova-cell3-metadata-neutron-config
  edpmServiceType: neutron-ovn
  playbook: osp.edpm.neutron_ovn
  tlsCerts:
    default:
      contents:
        - dnsnames
        - ips
      issuer: osp-rootca-issuer-ovn
      keyUsages:
        - digital signature
        - key encipherment
        - client auth
      networks:
        - ctlplane
