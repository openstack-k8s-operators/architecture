---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../multi-namespace/control-plane2
  - ../../../../va/multi-namespace-skmo/octavia-controlplane

resources:
  - skmo-values.yaml
  - networking/octavia-netattach.yaml
  - octavia-ca-passphrase.yaml

patches:
  - target:
      kind: ConfigMap
      name: service-values
    path: service-values.yaml
  - target:
      group: core.openstack.org
      version: v1beta1
      kind: OpenStackControlPlane
      name: controlplane
    path: application-credentials.yaml
  - target:
      group: core.openstack.org
      version: v1beta1
      kind: OpenStackControlPlane
      name: controlplane
    patch: |-
      - op: remove
        path: /spec/keystone/template/override/service/internal/metadata
      - op: remove
        path: /spec/keystone/template/override/service/internal/spec
      - op: replace
        path: /spec/rabbitmq/templates/rabbitmq/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/rabbitmq/templates/rabbitmq/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/rabbitmq/templates/rabbitmq-cell1/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/rabbitmq/templates/rabbitmq-cell1/resources/limits/memory
        value: 2Gi

replacements:
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.horizon.enabled
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.horizon.enabled
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.keystone.externalKeystoneAPI
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.externalKeystoneAPI
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.applicationCredentialEnabled
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.applicationCredential.enabled
        options:
          create: true

  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.leafRegion
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.region
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.leafAdminUser
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.adminUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.leafAdminProject
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.adminProject
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.leafAdminPasswordKey
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.passwordSelectors.admin
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserBarbican
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.barbican.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserCinder
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserGlance
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.glance.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserNeutron
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.neutron.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserNova
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.nova.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserOctavia
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.octavia.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserPlacement
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.placement.template.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.serviceUserSwift
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.swift.template.swiftProxy.serviceUser
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.keystoneInternalURL
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.override.service.internal.endpointURL
        options:
          create: true
  - source:
      kind: ConfigMap
      name: skmo-values
      fieldPath: data.keystonePublicURL
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.keystone.template.override.service.public.endpointURL
        options:
          create: true

  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.barbican.barbicanKeystoneListener.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.barbican.template.barbicanKeystoneListener.customServiceConfig
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.tls
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.tls
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.glance.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.glance.template.customServiceConfig
        options:
          create: true

  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.cinderBackup.replicas
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.cinderBackup.replicas
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.cinderBackup.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.cinderBackup.customServiceConfig
        options:
          create: true

  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.cinderVolumes.lvm-iscsi.replicas
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.cinderVolumes.lvm-iscsi.replicas
        options:
          create: true

  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.cinderVolumes.lvm-iscsi.nodeSelector.openstack\.org/cinder-lvm
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.cinderVolumes.lvm-iscsi.nodeSelector.openstack\.org/cinder-lvm
        options:
          create: true

  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.cinderVolumes.lvm-iscsi.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.cinder.template.cinderVolumes.lvm-iscsi.customServiceConfig
        options:
          create: true
