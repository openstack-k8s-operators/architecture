---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The hci OCP node network policies plus a publicapi VLAN interface on each node.
# Like ../../../hci/control-plane/networking/nncp, with the publicapi component.
transformers:
  # Set namespace to OpenStack on all namespaced objects without a namespace
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: _ignored_
      namespace: openstack
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - path: metadata/name
        kind: Namespace
        create: true

components:
  - ../../../../../lib/nncp-single-nic
  - ../components/nncp-publicapi

resources:
  - values.yaml
