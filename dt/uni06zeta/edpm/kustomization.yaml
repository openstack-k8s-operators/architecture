---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: _ignored_
      namespace: openstack
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - path: metadata/name
        kind: Namespace
        create: true

components:
  - ../../../lib/dataplane

resources:
  - resources/nova-extra-config.yaml

replacements:
  #
  # Nova
  #
  - source:
      kind: ConfigMap
      name: edpm-nodeset-values
      fieldPath: data.nova-extra-config
    targets:
      - select:
          kind: ConfigMap
          name: nova-extra-config
        fieldPaths:
          - data.55-nova-extra\.conf
        options:
          create: true
