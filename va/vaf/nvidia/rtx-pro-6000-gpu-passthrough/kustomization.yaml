---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NVIDIA RTX PRO 6000 GPU passthrough is a nova04delta-based deployment: full-device
# VFIO passthrough (type-PF) of the GPU (10de:2bb5) to tenant VMs. This VA builds on
# the nova04delta DT, which already provides lib/control-plane plus the
# nova/neutron/glance/swift/telemetry service-values replacements. Networking is
# composed under networking/.
components:
  - ../../../../dt/nova/nova04delta
