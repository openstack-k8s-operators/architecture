---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NVIDIA RTX PRO 6000 GPU passthrough: full-device VFIO passthrough (type-PF) of the
# GPU (10de:2bb5) to tenant VMs. Networking is composed under networking/.

transformers:
  # Set namespace to openstack on all namespaced objects without a namespace
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: _ignored_
      namespace: openstack
    setRoleBindingSubjects: none
    unsetOnly: true
    fieldSpecs:
      - path: metadata/name
        kind: Namespace
        create: true

components:
  - ../../../../lib/control-plane

replacements:
  # Neutron ML2
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.neutron.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.neutron.template.customServiceConfig
        options:
          create: true
  # OVN bridge mapping
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.ovn.ovnController.nicMappings
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.ovn.template.ovnController.nicMappings
        options:
          create: true
  # Glance
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.glance.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.glance.template.customServiceConfig
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.glance.default.replicas
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.glance.template.glanceAPIs.default.replicas
        options:
          create: true
  # Swift enabled flag
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.swift.enabled
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.swift.enabled
        options:
          create: true
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.swift.template.swiftStorage.storageClass
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.swift.template.swiftStorage.storageClass
        options:
          create: true
  # Manila API route annotations
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.manila.apiOverride.route
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.manila.apiOverride.route
        options:
          create: true
  # Telemetry
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.telemetry
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.telemetry
        options:
          create: true
  # Nova API: RTX PRO 6000 PCI alias + pci_in_placement
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.nova.apiServiceTemplate.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.nova.template.apiServiceTemplate.customServiceConfig
        options:
          create: true
  # Nova cell0 conductor
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.nova.cell0.conductorServiceTemplate.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.nova.template.cellTemplates.cell0.conductorServiceTemplate.customServiceConfig
        options:
          create: true
  # Nova cell1 conductor
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.nova.cell1.conductorServiceTemplate.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.nova.template.cellTemplates.cell1.conductorServiceTemplate.customServiceConfig
        options:
          create: true
  # Nova scheduler: PciPassthroughFilter
  - source:
      kind: ConfigMap
      name: service-values
      fieldPath: data.nova.schedulerServiceTemplate.customServiceConfig
    targets:
      - select:
          kind: OpenStackControlPlane
        fieldPaths:
          - spec.nova.template.schedulerServiceTemplate.customServiceConfig
        options:
          create: true
