---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The publicapi MetalLB pool and its L2 advertisement, from network-values.
resources:
  - metallb.yaml

replacements:
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.lb_addresses
    targets:
      - select:
          kind: IPAddressPool
          name: publicapi
        fieldPaths:
          - spec.addresses
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.iface
    targets:
      - select:
          kind: L2Advertisement
          name: publicapi
        fieldPaths:
          - spec.interfaces.0
