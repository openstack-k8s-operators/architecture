---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Adds the publicapi VLAN interface to the OCP node network policies, from the
# publicapi entries of network-values. Only the OCP nodes get it.
patches:
  - target:
      kind: NodeNetworkConfigurationPolicy
      labelSelector: osp/nncp-node=node-0
    patch: |-
      - op: add
        path: /spec/desiredState/interfaces/-
        value:
          description: publicapi vlan interface
          ipv4:
            address:
              - ip: _replaced_
                prefix-length: 24
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
          name: publicapi
          state: up
          type: vlan
          vlan:
            base-iface: _replaced_
            id: 24
          mtu: 1496
  - target:
      kind: NodeNetworkConfigurationPolicy
      labelSelector: osp/nncp-node=node-1
    patch: |-
      - op: add
        path: /spec/desiredState/interfaces/-
        value:
          description: publicapi vlan interface
          ipv4:
            address:
              - ip: _replaced_
                prefix-length: 24
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
          name: publicapi
          state: up
          type: vlan
          vlan:
            base-iface: _replaced_
            id: 24
          mtu: 1496
  - target:
      kind: NodeNetworkConfigurationPolicy
      labelSelector: osp/nncp-node=node-2
    patch: |-
      - op: add
        path: /spec/desiredState/interfaces/-
        value:
          description: publicapi vlan interface
          ipv4:
            address:
              - ip: _replaced_
                prefix-length: 24
            enabled: true
            dhcp: false
          ipv6:
            enabled: false
          name: publicapi
          state: up
          type: vlan
          vlan:
            base-iface: _replaced_
            id: 24
          mtu: 1496

replacements:
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.base_iface
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].vlan.base-iface
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.vlan
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].vlan.id
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.mtu
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].mtu
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.prefix-length
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].ipv4.address.0.prefix-length
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.node_0.publicapi_ip
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
          labelSelector: osp/nncp-node=node-0
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].ipv4.address.0.ip
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.node_1.publicapi_ip
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
          labelSelector: osp/nncp-node=node-1
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].ipv4.address.0.ip
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.node_2.publicapi_ip
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
          labelSelector: osp/nncp-node=node-2
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].ipv4.address.0.ip
  # Last: it renames the interface the selectors above match by name.
  - source:
      kind: ConfigMap
      name: network-values
      fieldPath: data.publicapi.iface
    targets:
      - select:
          kind: NodeNetworkConfigurationPolicy
        fieldPaths:
          - spec.desiredState.interfaces.[name=publicapi].name
